name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

# Default to no permissions; each job opts into exactly what it needs.
permissions: {}

jobs:
  # Runs on every push to main. If there are pending changesets it opens/updates
  # the "Version Packages" PR. It has NO npm token, so it can never publish —
  # merging feature PRs just refreshes the release PR, with no approval prompt.
  version:
    name: Open / update the Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update the Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          # The org enforces "Allow GitHub Actions to create and approve pull
          # requests" = off, so the built-in GITHUB_TOKEN cannot open the Version
          # PR. CHANGESETS_TOKEN is a fine-grained PAT scoped to ONLY this repo
          # (Contents + Pull requests: read/write) — it acts as a user, so it
          # bypasses that org lock while staying repo-scoped. As a bonus, PRs it
          # opens DO trigger ci.yml (GITHUB_TOKEN-opened PRs don't).
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}

  # Only runs once every changeset has been consumed (i.e. the Version Packages
  # PR was merged). Gated by the `release` GitHub Environment — the NPM_TOKEN is
  # an Environment secret, so publishing physically cannot happen until a human
  # approves the run.
  publish:
    name: Publish to npm
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    # Manual-approval gate. Environments with required reviewers are free on
    # PUBLIC repos but need a paid plan on private ones, so this is commented out
    # while the repo is private. Until then, NPM_TOKEN is a repository Actions
    # secret and this job runs ungated — protect it with a narrowly-scoped,
    # short-lived npm Granular/Automation token. Uncomment the moment the repo is
    # public, then create the `release` Environment (required reviewer = you) and
    # move NPM_TOKEN to be an Environment secret there.
    # environment: release
    permissions:
      contents: write # create git tags + GitHub Releases
      id-token: write # provenance-ready (used once the repo is public)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Supply-chain provenance. Requires a PUBLIC repo — npm rejects
          # provenance from a private source. Uncomment the moment this repo is
          # open-sourced; the `id-token: write` permission above is already in place.
          # NPM_CONFIG_PROVENANCE: "true"
