name: CI

# PRs only. The merged code was already validated on its PR, so re-running CI on
# every push to main is redundant — main pushes just run the Release workflow.
# (Keep "Require branches to be up to date before merging" on in branch protection
# so the PR is always tested against the latest main.)
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI reads the repo to build/test. The coverage step also
# posts a sticky comment on the PR, which needs write access to pull requests.
permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: Lint · Types · Build · Test · Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore Turbo's local task cache so unchanged packages skip
      # build/lint/types/test on repeat pushes to a PR. Keys are content-hashed,
      # so a stale or missing cache only ever forces a rebuild, never a wrong result.
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # One Turbo invocation: build the dependency graph once, then fan lint,
      # type-check, and unit tests out across packages in parallel — each package
      # is linted/typed/tested as soon as its deps are built, instead of waiting
      # for every build to finish. `test:coverage` runs the same unit tests as
      # `test`, just instrumented — it still gates the PR (no thresholds set, so
      # it only fails on a failing test) and writes each package's coverage/
      # reports for the report steps below. --continue runs every check even
      # after one fails (so a PR surfaces all failures at once); Turbo still
      # exits non-zero on any failure. Integration tests stay gated behind
      # SYMM_RUN_INTEGRATION and a funded key, and never run here.
      - name: Build · Lint · Types · Test + Coverage
        run: pnpm exec turbo run build lint check-types test:coverage --continue

      # Post a coverage summary as a sticky PR comment (one per package) plus a
      # table in the Actions job summary. Self-hosted — no external account or
      # secret, it just parses each package's coverage/coverage-*.json.
      # `if: ${{ !cancelled() }}` so the report still posts when a test failed
      # above (--continue kept the run going, Turbo exits non-zero, but the
      # coverage that did get written is still worth seeing). `file-coverage-mode:
      # all` lists every source file — including 0%-covered ones — so untested
      # files surface. No `vite-config-path`: there are no thresholds to read, and
      # pointing paths from the repo root avoids the action loading a build config.
      # Fork and Dependabot PRs have read-only tokens: keep their job summaries,
      # but skip comments so reporting cannot block package previews.
      - name: Coverage report — trading-core
        if: ${{ !cancelled() }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: trading-core
          comment-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && 'pr' || 'none' }}
          json-summary-path: packages/trading-core/coverage/coverage-summary.json
          json-final-path: packages/trading-core/coverage/coverage-final.json
          file-coverage-mode: all

      - name: Coverage report — trading-react
        if: ${{ !cancelled() }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: trading-react
          comment-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && 'pr' || 'none' }}
          json-summary-path: packages/trading-react/coverage/coverage-summary.json
          json-final-path: packages/trading-react/coverage/coverage-final.json
          file-coverage-mode: all

      - name: Coverage report — utils
        if: ${{ !cancelled() }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: utils
          comment-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && 'pr' || 'none' }}
          json-summary-path: packages/utils/coverage/coverage-summary.json
          json-final-path: packages/utils/coverage/coverage-final.json
          file-coverage-mode: all

      - name: Coverage report — session-key
        if: ${{ !cancelled() }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: session-key
          comment-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && 'pr' || 'none' }}
          json-summary-path: packages/session-key/coverage/coverage-summary.json
          json-final-path: packages/session-key/coverage/coverage-final.json
          file-coverage-mode: all

  # Verify the PUBLISHED shape of the packages (compiled JS, generated .d.ts, and the
  # exports/files manifest) the way an external npm consumer sees them — packed tarballs
  # linted by publint + attw, then installed into a consumer outside the workspace and
  # typechecked under strict nodenext + runtime-imported. The in-repo `verify` job above
  # only ever exercises workspace symlinks under bundler resolution, so it cannot catch a
  # broken subpath export, an unresolvable .d.ts, or a file missing from the tarball.
  # A separate job so its external install does not serialize behind `verify`.
  packages:
    name: Verify published packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Verify packages
        run: pnpm verify-packages

  preview:
    name: Publish package previews
    needs: [verify, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # pkg.pr.new identifies PR previews by the head SHA. Build that commit,
      # rather than GitHub's temporary merge commit used by the checks above.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Recheck the head commit's packed output before publishing. Turbo reuses
      # unchanged builds from the preceding jobs.
      - name: Verify PR head packages
        run: pnpm verify-packages

      # Publish directories together so sibling dependencies use the same
      # commit's preview URLs. The GitHub App handles the PR comment.
      # Full URLs avoid the older Trading-SDK repository metadata on npm.
      - name: Publish previews
        env:
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          packages=(
            ./packages/trading-core
            ./packages/trading-react
            ./packages/utils
            ./packages/session-key
            ./packages/eslint-config
            ./packages/typescript-config
          )

          # Keep each package's own version, adding a prerelease suffix only in
          # this disposable CI checkout. Install/build/verification are done.
          node --input-type=module - "${packages[@]}" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const sha = process.env.PREVIEW_SHA;
          if (!sha || !/^[0-9a-f]{40}$/i.test(sha)) {
            throw new Error("PREVIEW_SHA must be the full PR head commit SHA.");
          }

          for (const directory of process.argv.slice(2)) {
            const path = join(directory, "package.json");
            const pkg = JSON.parse(readFileSync(path, "utf8"));
            const [version, metadata] = pkg.version.split("+");
            const separator = version.includes("-") ? "." : "-";
            pkg.version = `${version}${separator}preview-${sha.slice(0, 7)}${metadata ? `+${metadata}` : ""}`;
            writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
            console.log(`${pkg.name}: ${pkg.version}`);
          }
          NODE

          pnpm exec pkg-pr-new publish \
            --pnpm \
            --no-compact \
            --comment=update \
            --packageManager=pnpm \
            --no-template \
            "${packages[@]}"
