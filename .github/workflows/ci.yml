name: CI

# PRs only. The merged code was already validated on its PR, so re-running CI on
# every push to main is redundant — main pushes just run the Release workflow.
# (Keep "Require branches to be up to date before merging" on in branch protection
# so the PR is always tested against the latest main.)
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  verify:
    name: Lint · Types · Build · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore Turbo's local task cache so unchanged packages skip
      # build/lint/types/test on repeat pushes to a PR. Keys are content-hashed,
      # so a stale or missing cache only ever forces a rebuild, never a wrong result.
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # One Turbo invocation: build the dependency graph once, then fan lint,
      # type-check, and unit tests out across packages in parallel — each package
      # is linted/typed/tested as soon as its deps are built, instead of waiting
      # for every build to finish. --continue runs every check even after one
      # fails (so a PR surfaces all failures at once); Turbo still exits non-zero
      # on any failure. Integration tests stay gated behind SYMM_RUN_INTEGRATION
      # and a funded key, and never run here.
      - name: Build · Lint · Types · Test
        run: pnpm exec turbo run build lint check-types test --continue
