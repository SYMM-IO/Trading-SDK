name: CI

# PRs only. The merged code was already validated on its PR, so re-running CI on
# every push to main is redundant — main pushes just run the Release workflow.
# (Keep "Require branches to be up to date before merging" on in branch protection
# so the PR is always tested against the latest main.)
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  verify:
    name: Lint · Types · Build · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      # Unit tests only. Integration tests are gated behind SYMM_RUN_INTEGRATION
      # and a funded key, and never run here.
      - name: Test
        run: pnpm test
